services:
  postgres:
    image: postgres:16
    container_name: retailerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailerp
      POSTGRES_USER: retailerp
      POSTGRES_PASSWORD: retailerp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
